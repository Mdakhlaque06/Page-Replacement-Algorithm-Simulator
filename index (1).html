<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Replacement Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📊 Page Replacement Simulator</h1>

    <div class="input-section">
        <label>Page Reference String:</label>
        <input type="text" id="pages" placeholder="e.g. 7 0 1 2 0 3 0 4 2 3 0 3 2">

        <label>Number of Frames:</label>
        <input type="number" id="frames" value="3" min="1">

        <button onclick="runSimulation()">Run Simulation</button>
    </div>

    <div id="results"></div>
</div>

<script src="script.js"></script>
</body>
</html>
